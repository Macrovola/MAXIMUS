name: Fetch GEOINT feeds

# Hourly: hazard feeds (USGS, NASA EONET, NWS, GDACS, NASA FIRMS) and live media
# (GDELT geolocated news, RSS news wires, live-stream checks, daily NASA GIBS imagery).
# Everything is published as one force-pushed commit on the `feeds-data` branch,
# so hourly updates never grow the repository's history.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test parsers
        run: python -m unittest discover -s backend -p "test_*.py"

      - name: Restore last run (fallback for failed sources; keeps daily imagery)
        run: |
          mkdir -p out
          if git fetch --depth 1 origin feeds-data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out || true
          fi
          mkdir -p out/data

      - name: Fetch hazard feeds
        run: python backend/fetch_feeds.py out/data/feeds.json

      - name: Fetch live media
        run: python backend/fetch_media.py out

      - name: Build manifest
        run: python backend/build_manifest.py out

      - name: Publish to feeds-data branch
        run: |
          cd out
          git init -q -b feeds-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ -d media ]; then git add media; fi
          git commit -q -m "Feeds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:feeds-data
